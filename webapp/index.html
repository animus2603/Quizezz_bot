<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudHub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===== ВЕРХНЯЯ ШАПКА ===== -->
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo-badge">🎓</span>
      <span data-i18n="appName">StudHub</span>
    </div>
    <button id="lang-switch" class="lang-pill" type="button">RU</button>
  </header>

  <!-- ===== ВЫПАДАЮЩЕЕ МЕНЮ ЯЗЫКА ===== -->
  <div id="lang-overlay" class="lang-overlay hidden">
    <div class="lang-menu">
      <button class="lang-option" data-lang="EN"><span class="lang-flag">🇬🇧</span> English</button>
      <button class="lang-option" data-lang="RU"><span class="lang-flag">🇷🇺</span> Русский</button>
      <button class="lang-option" data-lang="KZ"><span class="lang-flag">🇰🇿</span> Қазақша</button>
      <button class="lang-option" data-lang="TM"><span class="lang-flag">🇹🇲</span> Türkmençe</button>
    </div>
  </div>

  <!-- ===== БАННЕР (только на Главной) ===== -->
  <div id="banner" class="banner">
    <div class="banner-track" id="banner-track"></div>
    <div class="banner-dots" id="banner-dots"></div>
  </div>

  <main class="content">

    <!-- ===== ГЛАВНАЯ ===== -->
    <section id="tab-home" class="tab-content active">
      <h2 data-i18n="noQuizFound">Нет нужного теста?</h2>
      <button id="btn-custom-order" class="btn-primary" data-i18n="orderCustomBtn">Заказать индивидуальный тест — 5000₸</button>

      <div id="custom-form" class="form hidden">
        <label data-i18n="cfFileLabel">Загрузить файл с вопросами (если нужно)</label>
        <input id="cf-file" type="file">
        <div id="cf-file-name" class="file-name"></div>

        <label data-i18n="cfDeadlineLabel">Дедлайн (дата и время)</label>
        <input id="cf-deadline" type="datetime-local">
        <div class="hint" id="cf-deadline-hint" data-i18n="cfDeadlineHint">Минимум через 24 часа от текущего момента</div>

        <label data-i18n="cfCommentLabel">Пожелания / инструкции</label>
        <textarea id="cf-comment" data-i18n-placeholder="cfCommentPlaceholder" placeholder="Например: нужно 90%+ правильных"></textarea>

        <button id="cf-submit" class="btn-primary" data-i18n="cfSubmit">Оформить заказ — 5000₸</button>
      </div>

      <h2 data-i18n="readyQuizzes">Готовые тесты</h2>
      <div id="catalog-list" class="list">…</div>
    </section>

    <!-- ===== КАТЕГОРИИ (маркетплейс) ===== -->
    <section id="tab-categories" class="tab-content">
      <div class="filter-row">
        <select id="market-filter">
          <option value="" data-i18n="catAll">Все категории</option>
          <option value="goods" data-i18n="catGoods">Товары</option>
          <option value="services" data-i18n="catServices">Услуги</option>
          <option value="ads" data-i18n="catAds">Реклама</option>
        </select>
        <button id="btn-toggle-filters" class="btn-secondary" data-i18n="moreFilters">🔍 Фильтры</button>
      </div>

      <div id="extra-filters" class="form hidden">
        <input id="filter-course" type="text" data-i18n-placeholder="fCourse" placeholder="Курс">
        <input id="filter-group" type="text" data-i18n-placeholder="fGroup" placeholder="Группа">
        <input id="filter-faculty" type="text" data-i18n-placeholder="fFaculty" placeholder="Факультет">
        <input id="filter-department" type="text" data-i18n-placeholder="fDepartment" placeholder="Кафедра">
        <input id="filter-subject" type="text" data-i18n-placeholder="fSubject" placeholder="Предмет">
        <div class="filter-btn-row">
          <button id="btn-apply-filters" class="btn-primary" data-i18n="applyFilters">Применить</button>
          <button id="btn-reset-filters" class="btn-secondary" data-i18n="resetFilters">Сбросить</button>
        </div>
      </div>

      <div id="market-list" class="list">…</div>
    </section>

    <!-- ===== РАЗМЕСТИТЬ (создание объявления) ===== -->
    <section id="tab-post" class="tab-content">
      <h2 data-i18n="newListingTitle">Новое объявление</h2>
      <div class="form">
        <label data-i18n="lfCategoryLabel">Категория</label>
        <select id="lf-category">
          <option value="goods" data-i18n="catGoodsSingle">Товар</option>
          <option value="services" data-i18n="catServicesSingle">Услуга</option>
          <option value="ads" data-i18n="catAdsSingle">Реклама</option>
        </select>

        <label data-i18n="lfTitleLabel">Название</label>
        <input id="lf-title" type="text" data-i18n-placeholder="lfTitlePlaceholder" placeholder="Например: Учебник по матанализу">

        <label data-i18n="lfDescLabel">Описание</label>
        <textarea id="lf-description" data-i18n-placeholder="lfDescPlaceholder" placeholder="Состояние, детали..."></textarea>

        <label data-i18n="lfPriceLabel">Цена (₸, необязательно)</label>
        <input id="lf-price" type="number" placeholder="5000">

        <label data-i18n="lfContactLabel">Контакт (@username)</label>
        <input id="lf-contact" type="text" placeholder="@your_username">

        <div class="form-row-2">
          <div>
            <label data-i18n="fCourse">Курс</label>
            <input id="lf-course" type="text">
          </div>
          <div>
            <label data-i18n="fGroup">Группа</label>
            <input id="lf-group" type="text">
          </div>
        </div>
        <div class="form-row-2">
          <div>
            <label data-i18n="fFaculty">Факультет</label>
            <input id="lf-faculty" type="text">
          </div>
          <div>
            <label data-i18n="fDepartment">Кафедра</label>
            <input id="lf-department" type="text">
          </div>
        </div>
        <label data-i18n="fSubject">Предмет</label>
        <input id="lf-subject" type="text">

        <button id="lf-submit" class="btn-primary" data-i18n="lfSubmit">Отправить на модерацию</button>
      </div>
    </section>

    <!-- ===== ЗАКАЗЫ ===== -->
    <section id="tab-orders" class="tab-content">
      <h2 data-i18n="myOrdersTitle">Мои заказы</h2>
      <div id="orders-list" class="list">…</div>

      <h2 data-i18n="myListingsTitle">Мои объявления</h2>
      <div id="my-listings-list" class="list">…</div>
    </section>

    <!-- ===== ПРОФИЛЬ ===== -->
    <section id="tab-profile" class="tab-content">
      <div class="profile-header">
        <img id="profile-avatar" class="profile-avatar" src="" alt="">
        <div id="profile-avatar-fallback" class="profile-avatar profile-avatar-fallback">?</div>
        <div class="profile-name" id="profile-name">—</div>
        <div class="profile-username" id="profile-username">—</div>
        <div class="profile-phone-row">
          <span id="profile-phone" class="profile-phone">—</span>
          <button id="btn-attach-phone" class="btn-link" data-i18n="attachPhone">Привязать номер</button>
          <button id="btn-refresh-profile" class="btn-icon" title="Обновить" type="button">⟳</button>
        </div>
      </div>

      <div class="profile-menu">
        <button class="profile-item" id="menu-settings">
          <span class="profile-item-icon">⚙️</span>
          <span class="profile-item-label" data-i18n="menuSettings">Настройки</span>
          <span class="profile-item-arrow">›</span>
        </button>
        <button class="profile-item" id="menu-notifications">
          <span class="profile-item-icon">🔔</span>
          <span class="profile-item-label" data-i18n="menuNotifications">Уведомления</span>
          <span class="profile-item-arrow">›</span>
        </button>
        <button class="profile-item" id="menu-faq">
          <span class="profile-item-icon">❓</span>
          <span class="profile-item-label" data-i18n="menuFaq">FAQ</span>
          <span class="profile-item-arrow">›</span>
        </button>
        <button class="profile-item" id="menu-support">
          <span class="profile-item-icon">💬</span>
          <span class="profile-item-label" data-i18n="menuSupport">Поддержка</span>
          <span class="profile-item-arrow">›</span>
        </button>
      </div>
    </section>

  </main>

  <!-- ===== НИЖНЕЕ МЕНЮ ===== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1v-9"/></svg>
      </span>
      <span class="nav-label" data-i18n="navHome">Главная</span>
    </button>
    <button class="nav-item" data-tab="categories">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </span>
      <span class="nav-label" data-i18n="navCategories">Категории</span>
    </button>
    <button class="nav-item" data-tab="post">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </span>
      <span class="nav-label" data-i18n="navPost">Разместить</span>
    </button>
    <button class="nav-item" data-tab="orders">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>
      </span>
      <span class="nav-label" data-i18n="navOrders">Заказы</span>
    </button>
    <button class="nav-item" data-tab="profile">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-4 4-6 7-6s5.5 2 7 6"/></svg>
      </span>
      <span class="nav-label" data-i18n="navProfile">Профиль</span>
    </button>
  </nav>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
