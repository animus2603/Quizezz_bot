<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bereket Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- ===== ВЕРХНЯЯ ШАПКА ===== -->
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo-badge">🔧</span>
      <span>Bereket Admin</span>
    </div>
  </header>

  <main class="content">
    <!-- ===== DASHBOARD ===== -->
    <section id="tab-dashboard" class="tab-content active">
      <h2>📊 Статистика</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-users">0</div>
          <div class="stat-label">Пользователей</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-orders">0</div>
          <div class="stat-label">Заказов</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-listings">0</div>
          <div class="stat-label">Объявлений</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-label">На модерации</div>
        </div>
      </div>

      <h2>⏳ Ожидают действий</h2>
      <div id="pending-list" class="list">Загрузка...</div>
    </section>

    <!-- ===== ЗАКАЗЫ ===== -->
    <section id="tab-orders" class="tab-content">
      <h2>📦 Заказы</h2>
      <div class="filter-row">
        <select id="order-filter">
          <option value="all">Все</option>
          <option value="awaiting_payment">Ожидают оплаты</option>
          <option value="payment_review">На проверке чека</option>
          <option value="in_progress">В работе</option>
          <option value="done">Готовы</option>
        </select>
      </div>
      <div id="orders-list" class="list">Загрузка...</div>
    </section>

    <!-- ===== ОБЪЯВЛЕНИЯ ===== -->
    <section id="tab-listings" class="tab-content">
      <h2>🛒 Объявления</h2>
      <div class="filter-row">
        <select id="listing-filter">
          <option value="all">Все</option>
          <option value="pending">На модерации</option>
          <option value="approved">Опубликованы</option>
          <option value="rejected">Отклонены</option>
        </select>
      </div>
      <div id="listings-list" class="list">Загрузка...</div>
    </section>

    <!-- ===== ТЕСТЫ ===== -->
    <section id="tab-quizzes" class="tab-content">
      <h2>📚 Тесты</h2>
      <button id="btn-add-quiz" class="btn-primary">+ Добавить тест</button>
      <div class="filter-row">
        <input type="text" id="quiz-search" placeholder="🔍 Поиск по названию или предмету..." class="search-input">
      </div>
      <div id="quizzes-list" class="list">Загрузка...</div>
    </section>

    <!-- ===== ФОРМА ДОБАВЛЕНИЯ ТЕСТА ===== -->
    <div id="quiz-form-overlay" class="overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h3>Добавить тест</h3>
          <button id="btn-close-quiz-form" class="btn-close">✕</button>
        </div>
        <div class="modal-body">
          <label>Название</label>
          <input type="text" id="quiz-title" placeholder="Например: Математический анализ — Модуль 1">
          <label>Предмет</label>
          <input type="text" id="quiz-subject" placeholder="Например: Математика">
          <label>Описание</label>
          <textarea id="quiz-description" placeholder="Краткое описание..."></textarea>
          <label>Факультет</label>
          <input type="text" id="quiz-faculty" placeholder="Например: Информационные технологии">
          <label>Кафедра</label>
          <input type="text" id="quiz-department" placeholder="Например: Прикладная математика">
          <label>Курс</label>
          <input type="text" id="quiz-course" placeholder="Например: 1">
          <label>Группа</label>
          <input type="text" id="quiz-group" placeholder="Например: ИС-21">
          <label>Цена (₸)</label>
          <input type="number" id="quiz-price" placeholder="3000">
          <label>Ссылка на файл</label>
          <input type="text" id="quiz-file-url" placeholder="https://example.com/quiz/math-1.pdf">
          <label>Пример вопросов (превью)</label>
          <textarea id="quiz-preview" placeholder="1. Вопрос 1&#10;2. Вопрос 2&#10;..."></textarea>
          <button id="btn-save-quiz" class="btn-primary">Сохранить</button>
        </div>
      </div>
    </div>

    <!-- ===== ПОЛЬЗОВАТЕЛИ ===== -->
    <section id="tab-users" class="tab-content">
      <h2>👥 Пользователи</h2>
      <div id="users-list" class="list">Загрузка...</div>
    </section>
  </main>

  <!-- ===== НИЖНЕЕ МЕНЮ ===== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="dashboard">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Статистика</span>
    </button>
    <button class="nav-item" data-tab="orders">
      <span class="nav-icon">📦</span>
      <span class="nav-label">Заказы</span>
    </button>
    <button class="nav-item" data-tab="listings">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">Объявления</span>
    </button>
    <button class="nav-item" data-tab="quizzes">
      <span class="nav-icon">📚</span>
      <span class="nav-label">Тесты</span>
    </button>
    <button class="nav-item" data-tab="users">
      <span class="nav-icon">👥</span>
      <span class="nav-label">Пользователи</span>
    </button>
  </nav>
</div>

<script src="js/app.js"></script>
</body>
</html>
