<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudHub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ===== ВЕРХНЯЯ ШАПКА ===== -->
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo-badge">🎓</span>
      <span data-i18n="appName">StudHub</span>
    </div>
    <button id="lang-switch" class="lang-pill" type="button">RU</button>
  </header>

  <!-- ===== БАННЕР ===== -->
  <div id="banner" class="banner">
    <div class="banner-track" id="banner-track"></div>
    <div class="banner-dots" id="banner-dots"></div>
  </div>

  <main class="content">

    <!-- ===== QUIZ TAB ===== -->
    <section id="tab-quiz" class="tab-content active">
      <h2 data-i18n="readyQuizzes">Готовые тесты</h2>
      <div id="catalog-list" class="list">…</div>

      <h2 data-i18n="noQuizFound">Нет нужного теста?</h2>
      <button id="btn-custom-order" class="btn-primary" data-i18n="orderCustomBtn">Заказать индивидуальный тест — 5000₸</button>

      <div id="custom-form" class="form hidden">
        <label data-i18n="cfFileLabel">Ссылка/описание вопросов теста</label>
        <input id="cf-file" type="text" data-i18n-placeholder="cfFilePlaceholder" placeholder="Ссылка на файл или Quizizz">

        <label data-i18n="cfDeadlineLabel">Дедлайн (дата и время)</label>
        <input id="cf-deadline" type="datetime-local">

        <label data-i18n="cfCommentLabel">Пожелания / инструкции</label>
        <textarea id="cf-comment" data-i18n-placeholder="cfCommentPlaceholder" placeholder="Например: нужно 90%+ правильных"></textarea>

        <button id="cf-submit" class="btn-primary" data-i18n="cfSubmit">Оформить заказ — 5000₸</button>
      </div>
    </section>

    <!-- ===== MARKET TAB ===== -->
    <section id="tab-market" class="tab-content">
      <div class="filter-row">
        <select id="market-filter">
          <option value="" data-i18n="catAll">Все категории</option>
          <option value="goods" data-i18n="catGoods">Товары</option>
          <option value="services" data-i18n="catServices">Услуги</option>
          <option value="ads" data-i18n="catAds">Реклама</option>
        </select>
        <button id="btn-new-listing" class="btn-secondary" data-i18n="newListingBtn">+ Разместить</button>
      </div>
      <div id="market-list" class="list">…</div>

      <div id="listing-form" class="form hidden">
        <label data-i18n="lfCategoryLabel">Категория</label>
        <select id="lf-category">
          <option value="goods" data-i18n="catGoodsSingle">Товар</option>
          <option value="services" data-i18n="catServicesSingle">Услуга</option>
          <option value="ads" data-i18n="catAdsSingle">Реклама</option>
        </select>

        <label data-i18n="lfTitleLabel">Название</label>
        <input id="lf-title" type="text" data-i18n-placeholder="lfTitlePlaceholder" placeholder="Например: Учебник по матанализу">

        <label data-i18n="lfDescLabel">Описание</label>
        <textarea id="lf-description" data-i18n-placeholder="lfDescPlaceholder" placeholder="Состояние, детали..."></textarea>

        <label data-i18n="lfPriceLabel">Цена (₸, необязательно)</label>
        <input id="lf-price" type="number" placeholder="5000">

        <label data-i18n="lfContactLabel">Контакт (@username)</label>
        <input id="lf-contact" type="text" placeholder="@your_username">

        <button id="lf-submit" class="btn-primary" data-i18n="lfSubmit">Отправить на модерацию</button>
      </div>
    </section>

    <!-- ===== MY TAB ===== -->
    <section id="tab-my" class="tab-content">
      <h2 data-i18n="myTitle">Мои заказы и объявления</h2>
      <p class="hint" data-i18n="myHint">Статусы заказов приходят вам личным сообщением от бота.</p>
    </section>

  </main>

  <!-- ===== НИЖНЕЕ МЕНЮ ===== -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="quiz">
      <span class="nav-icon">📚</span>
      <span class="nav-label" data-i18n="navQuiz">Тесты</span>
    </button>
    <button class="nav-item" data-tab="market">
      <span class="nav-icon">🛒</span>
      <span class="nav-label" data-i18n="navMarket">Маркет</span>
    </button>
    <button class="nav-item" data-tab="my">
      <span class="nav-icon">👤</span>
      <span class="nav-label" data-i18n="navMy">Профиль</span>
    </button>
  </nav>

  <div id="toast" class="toast hidden"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
